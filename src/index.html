<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playbook do WR</title>
<!--@PWA_HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">

</head>
<body>
<main class="app" id="view"><div class="splash"><!--@LOGO--><p>Carregando seus dados…</p></div></main>
<div class="rest" id="rest" role="timer" aria-label="Cronômetro de descanso"><div class="t" id="restT">0:00</div><div class="grow" id="restL">Descanso</div><button class="btn sm" data-act="rest+">+15 s</button><button class="btn sm" data-act="rest-stop">Pular</button><div class="rest-bar"><i id="restP"></i></div></div>
<div id="toast" role="status"></div>
<nav class="tabs" id="tabs" aria-label="Seções">
  <button data-tab="hoje"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 6v12M15 6v12"/></svg>Hoje</button>
  <button data-tab="treino"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Treino</button>
  <button data-tab="comida"><svg viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8a2 2 0 0 1-2 2M18 3c-2 2-3 5-3 8h3v10"/></svg>Comida</button>
  <button data-tab="evol"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-7"/></svg>Evolução</button>
  <button data-tab="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</button>
</nav>
